<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow Dashboard</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>

    <header class="header">
        <div class="header__main-info">
            <h1 class="header__title">⚡ StudyFlow</h1>
            <div id="user-streak" class="streak-badge" title="Dias seguidos de tarefas concluídas">🔥 0 dias</div>
        </div>
        <button id="theme-toggle" class="header__toggle">🌓 Alternar Tema</button>
    </header>

    <nav class="app-nav" aria-label="Navegacao principal">
        <a href="index.html" class="app-nav__link app-nav__link--active">
            <span class="app-nav__icon">▦</span>
            <span class="app-nav__label">Dashboard</span>
        </a>
        <a href="#tasks-section" class="app-nav__link">
            <span class="app-nav__icon">✓</span>
            <span class="app-nav__label">Tarefas</span>
        </a>
        <a href="js/cronograma.html" class="app-nav__link">
            <span class="app-nav__icon">□</span>
            <span class="app-nav__label">Cronograma</span>
        </a>
        <a href="#focus-section" class="app-nav__link">
            <span class="app-nav__icon">◷</span>
            <span class="app-nav__label">Foco</span>
        </a>
        <a href="#notes-section" class="app-nav__link">
            <span class="app-nav__icon">✎</span>
            <span class="app-nav__label">Notas</span>
        </a>
    </nav>

    <main class="app-container">
        
        <div class="main-content">
            
            <div class="progress-container">
                <div class="progress-bar__label">Conclusão Geral: <span id="progress-percentage">0%</span></div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-bar__fill" style="width: 0%;"></div>
                </div>
            </div>

            <section class="dashboard-summary">
                <div class="summary-card" data-type="total">
                    <span class="summary-card__title">Total</span>
                    <span class="summary-card__value" id="count-total">0</span>
                </div>
                <div class="summary-card" data-type="pending">
                    <span class="summary-card__title">Pendentes</span>
                    <span class="summary-card__value" id="count-pending">0</span>
                </div>
                <div class="summary-card" data-type="in-progress">
                    <span class="summary-card__title">Em Progresso</span>
                    <span class="summary-card__value" id="count-in-progress">0</span>
                </div>
                <div class="summary-card" data-type="completed">
                    <span class="summary-card__title">Concluídas</span>
                    <span class="summary-card__value" id="count-completed">0</span>
                </div>
                <div class="summary-card" data-type="overdue">
                    <span class="summary-card__title">Atrasadas</span>
                    <span class="summary-card__value" id="count-overdue">0</span>
                </div>
            </section>

            <section id="add-task-section" class="add-task-section">
                <h2 class="section-title">Nova Tarefa</h2>
                <form id="task-form" class="form">
                    <div class="form__group">
                        <label for="task-title" class="form__label">Título da Tarefa</label>
                        <input type="text" id="task-title" class="form__input" placeholder="Ex: Estudar Álgebra Linear">
                        <span id="error-title" class="form__error"></span>
                    </div>

                    <div class="form__row">
                        <div class="form__group">
                            <label for="task-category" class="form__label">Categoria</label>
                            <input type="text" id="task-category" class="form__input" placeholder="Ex: Programação, Matemática" list="categories-datalist">
                            <datalist id="categories-datalist">
                                <option value="Geral">
                                <option value="Matemática">
                                <option value="Programação">
                                <option value="História">
                                <option value="Idiomas">
                            </datalist>
                        </div>
                        <div class="form__group">
                            <label for="task-priority" class="form__label">Prioridade</label>
                            <select id="task-priority" class="form__input">
                                <option value="baixa">Baixa</option>
                                <option value="media" selected>Média</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>
                        <div class="form__group">
                            <label for="task-deadline" class="form__label">Prazo de Entrega</label>
                            <input type="date" id="task-deadline" class="form__input">
                        </div>
                    </div>

                    <div class="form__actions">
                        <button type="submit" class="btn btn--primary">Adicionar Tarefa</button>
                    </div>
                </form>
            </section>

            <section id="tasks-section" class="tasks-section">
                <h2 class="section-title">Minhas Tarefas</h2>
                
                <div class="controls-section">
                    <input type="text" id="search-input" class="search-box__input" placeholder="Buscar por título ou prioridade...">
                    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                        <div class="form__group" style="margin: 0; flex-direction: row; align-items: center; gap: 0.5rem;">
                            <label for="sort-select" class="form__label" style="margin: 0; white-space: nowrap;">Ordenar por:</label>
                            <select id="sort-select" class="form__input" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
                                <option value="creation">Data de Criação</option>
                                <option value="deadline">Prazo de Entrega</option>
                                <option value="urgency">Urgência 🔥</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <button class="btn-filter btn-filter--active" data-filter="all">Todas</button>
                            <button class="btn-filter" data-filter="pending">Pendentes</button>
                            <button class="btn-filter" data-filter="in-progress">Em Progresso</button>
                            <button class="btn-filter" data-filter="completed">Concluídas</button>
                        </div>
                    </div>
                </div>

                <ul id="tasks-list" class="tasks-list">
                    </ul>
            </section>

            <section id="chart-section" class="chart-section">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1.2rem;">
                    <h2 class="section-title" style="border: none; margin: 0; padding: 0;">Resumo Tarefas</h2>
                    <div class="chart-toggles" style="display: flex; gap: 0.3rem;">
                        <button id="chart-toggle-dist" class="btn-preset btn-preset--active" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">Status</button>
                        <button id="chart-toggle-weekly" class="btn-preset" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">Semanal</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="performance-chart"></canvas>
                </div>
            </section>
        </div>

        <aside class="sidebar">
            
            <section id="focus-section" class="timer-section">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1.2rem;">
                    <h2 class="section-title" style="border: none; margin: 0; padding: 0;">⏱️ Timer de Foco</h2>
                    <button id="timer-sound-toggle" class="header__toggle" style="padding: 0.2rem 0.6rem; font-size: 0.8rem;">🔊 Som</button>
                </div>

                <div class="timer-presets" style="display: flex; justify-content: space-between; gap: 0.4rem; margin-bottom: 1rem;">
                    <button class="btn-preset btn-preset--active" data-duration="25:00" style="flex: 1; padding: 0.4rem; font-size: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--border-radius); background: var(--bg-color); color: var(--text-color); cursor: pointer; font-weight: 600; transition: var(--transition);">Foco</button>
                    <button class="btn-preset" data-duration="05:00" style="flex: 1; padding: 0.4rem; font-size: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--border-radius); background: var(--bg-color); color: var(--text-color); cursor: pointer; font-weight: 600; transition: var(--transition);">Curta</button>
                    <button class="btn-preset" data-duration="15:00" style="flex: 1; padding: 0.4rem; font-size: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--border-radius); background: var(--bg-color); color: var(--text-color); cursor: pointer; font-weight: 600; transition: var(--transition);">Longa</button>
                </div>

                <div class="timer-display">
                    <span id="timer-minutes">25</span>:<span id="timer-seconds">00</span>
                </div>
                
                <div id="pomodoro-count" class="pomodoro-count" style="text-align: center; margin-bottom: 1rem; font-size: 0.9rem; font-weight: 600; color: var(--text-color);">
                    🍅 Sessões hoje: 0
                </div>
                
                <div class="timer-custom-group" style="margin-bottom: 1rem;">
                    <label for="timer-duration" class="form__label">Configurar Tempo (MM:SS):</label>
                    <input type="text" id="timer-duration" class="form__input timer-input-field" value="25:00" placeholder="Ex: 00:10 ou 25:00">
                </div>

                <div class="timer-task-group" style="display: flex; flex-direction: column; margin-bottom: 1rem; width: 100%;">
                    <label for="timer-task-select" class="form__label">Vincular a uma tarefa:</label>
                    <select id="timer-task-select" class="form__input" style="width: 100%;">
                        <option value="">Nenhuma tarefa selecionada</option>
                    </select>
                </div>

                <div class="timer-controls">
                    <button id="timer-start" class="btn btn--success">Iniciar</button>
                    <button id="timer-pause" class="btn btn--warning" disabled>Pausar</button>
                    <button id="timer-reset" class="btn btn--danger">Reiniciar</button>
                </div>
            </section>

            <section id="notes-section" class="notes-section">
                <h2 class="section-title">📝 Anotações Rápidas</h2>
                <form id="note-form">
                    <textarea id="note-text" class="form__textarea" placeholder="Digite um insight ou lembrete rápido..."></textarea>
                    <div class="form__group" style="margin-bottom: 1rem;">
                        <label for="note-task-select" class="form__label">Vincular a uma tarefa (opcional):</label>
                        <select id="note-task-select" class="form__input" style="width: 100%; font-size: 0.85rem; padding: 0.4rem;">
                            <option value="">Nenhuma tarefa selecionada</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn--primary">Salvar Nota</button>
                </form>
                <div id="notes-list" style="margin-top: 1rem;">
                    </div>
            </section>

        </aside>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
